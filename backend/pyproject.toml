# Tool configuration only. Dependencies live in requirements.txt / requirements-dev.txt (pip + venv).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import sorting, bugbear, pyupgrade
select = ["E", "F", "I", "B", "UP"]
